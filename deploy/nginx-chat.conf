# ============================================================
# Baka Community 聊天室 · Nginx HTTPS + WSS 反向代理配置
#
# 目标架构（后端无需改动，仍监听 127.0.0.1:8080）：
#
#   浏览器 ── HTTPS ──> Nginx :443 ── HTTP ──────────> C++ 后端静态前端（:8080）
#   浏览器 ── WSS  ──> Nginx :443 ── WebSocket proxy ─> C++ Chat Server（:8080/ws）
#
# 前端已根据页面协议自动选择 wss/ws（见 frontend/src/backendClient.js），
# 因此 HTTPS 页面会自动连 wss://<host>/ws，无需再改前端代码。
#
# 安装步骤（Ubuntu/Debian）：
#   1) 复制本文件：
#        sudo cp deploy/nginx-chat.conf /etc/nginx/sites-available/chat
#   2) 把 chat.example.com 替换成你的域名，并配置好 SSL 证书路径。
#   3) 启用站点：
#        sudo ln -s /etc/nginx/sites-available/chat /etc/nginx/sites-enabled/chat
#   4) 校验并重载：
#        sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# WebSocket 需要根据请求头动态设置 Connection，避免普通 HTTP 请求被强制 upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS 永久跳转
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    # Let's Encrypt HTTP-01 验证目录（certbot webroot 方式续期时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：前端页面 + WebSocket 统一走 443
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.example.com;

    # ---- TLS 证书（请替换为实际路径） ----
    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 前端静态资源：Nginx 443 → HTTP → C++ 后端静态服务（:8080）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket：浏览器 WSS 443 → Nginx → ws://127.0.0.1:8080/ws
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 聊天/文件分片为长连接，放宽读写超时（前端每 30s 有心跳）
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
