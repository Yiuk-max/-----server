syntax = "proto3";

package chat_proto;

// 被回复消息摘要（对应原 JSON reply_to）
message ReplyTo {
  int32  message_id  = 1;
  string sender_name = 2;
  string content     = 3;
}

// 登录成功返回的用户信息（对应原 JSON user）
message UserInfo {
  int32  id       = 1;
  string username = 2;
}

// 聊天历史单条记录（对应 history_response.messages[]）
message ChatItem {
  int32  message_id          = 1;
  int32  sender_UID          = 2;
  string sender_name         = 3;
  bool   is_group            = 4;
  string content             = 5;
  string timestamp           = 6;
  int32  reply_to_message_id = 7;
  ReplyTo reply_to           = 8;
  bool   is_file             = 9;   // 文件消息
  int32  file_id             = 10;  // file.id
  string file_name           = 11;  // 原始文件名
  uint64 file_size           = 12;  // 文件大小
}

// 文件分块元信息（对应 upload_file.meta / 下载 file_chunk 头部）
message FileChunkMeta {
  string type        = 1;  // 恒为 "file_chunk"
  string file_id     = 2;
  string filename    = 3;
  uint64 total_size  = 4;
  uint32 chunk_index = 5;
  uint32 chunk_count = 6;
  uint32 chunk_size  = 7;
  uint64 offset      = 8;
  string transfer_id = 9;  // 传输会话 ID（上传/下载分块必带）
  string hash        = 10; // 首块可选携带全文件 sha256（当前未强制校验）
}

// 文件元数据（file 表协议视图）
message FileMeta {
  string file_id       = 1;  // string 化的 file.id
  string original_name = 2;
  string mime_type     = 3;
  uint64 size          = 4;
  string hash          = 5;
  string type          = 6;  // avatar/emoji/image/attachment/file
  int32  uploader_uid  = 7;
  string created_at    = 8;
}

// 传输会话状态（file_transfer 表协议视图）
message FileTransferInfo {
  string transfer_id      = 1;
  string file_id          = 2;
  int32  uploader_uid     = 3;
  int32  receiver_uid     = 4;
  string direction        = 5;  // upload / download
  string status           = 6;  // uploading/downloading/paused/completed/cancelled/failed
  uint64 total_size       = 7;
  uint64 transferred_size = 8;
  uint32 chunk_size       = 9;
  uint32 chunk_count      = 10;
  uint32 next_chunk_index = 11;
}

// 社区（核心频道）信息
message CommunityInfo {
  int32  community_id = 1;
  string name         = 2;
  string description  = 3;
  string avatar       = 4;  // file_id 字符串
  string category     = 5;  // 预留：社区所属分区
  string my_role      = 6;  // owner/admin/member
  int32  avatar_id    = 7;  // 社区头像 file.id（-1 未设置）
  int32  banner_id    = 8;  // 社区背景图 file.id（-1 未设置）
}

// 社区普通频道信息
message ChannelInfo {
  int32  channel_id   = 1;
  int32  community_id = 2;
  string name         = 3;
  string category     = 4;  // 频道分区
}

// 社区成员信息
message MemberInfo {
  int32  user_uid  = 1;
  string nickname  = 2;  // 社区昵称（空则前端用全局昵称）
  string role      = 3;
  int32  avatar_id = 4;  // 成员头像 file.id（-1 表示未设置）
}

// 会话/联系人（好友或群）
message ContactInfo {
  int32  uid       = 1;
  string name      = 2;
  bool   is_group  = 3;
  int32  avatar_id = 4;  // 好友头像 file.id；群为 0
}

// 顶层信封（一个 message 承载所有请求/响应字段）
message Envelope {
  string type    = 1;  // 对应原 JSON type，保留字符串便于 handlers_ 分发
  string content = 2;  // 对应原 JSON content

  // 私聊/群聊
  int32  target_UID = 3;
  string message    = 4;

  // 消息 ID / 历史分页
  int32  message_id = 5;
  int32  peer_id    = 6;
  int32  before_id  = 7;
  bool   has_more   = 8;

  // 群相关
  int32  group_UID       = 9;
  int32  target_user_UID = 10;
  int32  requester_UID   = 11;
  string group_name      = 12;
  string new_name        = 13;
  bool   promote         = 14;

  // 好友相关
  int32  friend_UID    = 15;
  int32  sender_UID    = 16;
  string email         = 17;  // add_friend/set_email/register；login 时非空表示邮箱登录
  string apply_message = 18;
  string remark        = 19;
  bool   accept        = 20;

  // 账号/登录
  int32    UID      = 21;  // login(UID)
  string   username = 22;
  string   password = 23;
  string   token    = 24;
  UserInfo user     = 25;  // login_success

  // 聊天消息附加字段
  string  sender_name         = 26;
  string  timestamp           = 27;
  int32   reply_to_message_id = 28;
  ReplyTo reply_to            = 29;

  // 文件
  string        file_name = 30;
  FileChunkMeta meta      = 31;

  // 历史响应
  repeated ChatItem messages = 32;

  // 社区/频道（编号从 33 起）
  int32  community_id = 33;  // 社区 id（=核心频道 id）
  int32  channel_id   = 34;  // 频道 id
  string category     = 35;  // 频道分区
  string description  = 36;  // 社区简介
  string avatar       = 37;  // 头像 file_id（预留）
  string role         = 38;  // 成员角色 owner/admin/member
  bool   is_channel   = 39;  // history_request 时标记频道历史
  repeated CommunityInfo communities = 40;
  repeated ChannelInfo   channels    = 41;
  repeated MemberInfo    members     = 42;
  string   theme         = 43;  // 主题（存于 Account.settings JSON，默认 "default"）

  // 文件系统（编号从 44 起）
  FileMeta          file_meta     = 44;
  FileTransferInfo  transfer_info = 45;
  int32             transfer_id   = 46;
  string            file_id       = 47;  // string 化的 file.id（download_init/file_delete 等）
  repeated FileMeta files         = 48;  // file_list_response

  // 头像 / 文件消息（M3 引用接入）
  int32  avatar_id  = 49;  // 当前账户头像 file.id（login_success 等返回）
  bool   is_file    = 50;  // 聊天消息是否为文件消息
  uint64 file_size  = 51;  // 文件消息大小（file_name 复用字段 30，file_id 复用字段 47）
  repeated ContactInfo contacts = 52;  // contact_list_response

  // 社区头像/背景图（modify_community 请求）
  int32 community_avatar_id = 53;  // 社区头像 file.id
  int32 community_banner_id = 54;  // 社区背景图 file.id

  // 分片下载请求（M4：可中断/续传）
  int32 chunk_index  = 55;  // file_download_chunk 请求的块号
}
